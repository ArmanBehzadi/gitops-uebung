<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fassung" content="__FASSUNG__">
<title>Übungs-Dashboard</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 12px 16px; }
  header { border-bottom: 1px solid GrayText; }
  h1 { font-size: 20px; margin: 0; }
  .kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .kachel { border: 1px solid GrayText; background: ButtonFace; color: ButtonText; padding: 12px; }
  .zahl { font-size: 28px; font-weight: 600; }
  .gut { border-left: 6px solid #2e7d32; } .warn { border-left: 6px solid #b26a00; } .fehler { border-left: 6px solid #c62828; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid GrayText; }
  .feld { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
  footer { color: GrayText; font-size: 13px; }
</style>
</head>
<body>
<header><h1>Übungs-Dashboard</h1><div>Schein-Oberfläche mit erfundenen Zahlen, ohne echte Daten.</div></header>
<main>
  <section class="kacheln">
    <div class="kachel gut"><div>Aufträge erledigt</div><div class="zahl">128</div></div>
    <div class="kachel warn"><div>Aufträge offen</div><div class="zahl">17</div></div>
    <div class="kachel fehler"><div>Fehlschläge</div><div class="zahl">3</div></div>
    <div class="kachel gut"><div>Verfügbarkeit</div><div class="zahl">99,2 %</div></div>
  </section>
  <table>
    <thead><tr><th>Bereich</th><th>Zustand</th><th>Läufe</th><th>Dauer (min)</th></tr></thead>
    <tbody>
      <tr><td>Bereich A</td><td><span class="feld" style="background:#2e7d32"></span>läuft</td><td>42</td><td>3,1</td></tr>
      <tr><td>Bereich B</td><td><span class="feld" style="background:#b26a00"></span>wartet</td><td>19</td><td>5,4</td></tr>
      <tr><td>Bereich C</td><td><span class="feld" style="background:#c62828"></span>gestoppt</td><td>7</td><td>8,0</td></tr>
    </tbody>
  </table>
</main>
<footer>Fassung __FASSUNG__</footer>
</body>
</html>
